<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordine confermato — PijamaMania</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{--notte:#0b1f3d;--sabbia:#fbf7f1;--corallo:#ff6a3d;--testo:#17243a;--grigio:#5e6b80}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--sabbia);color:var(--testo);
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;line-height:1.55}
.box{max-width:440px;background:#fff;border:1px solid #e7dfd2;border-radius:20px;padding:34px 26px;box-shadow:0 12px 34px rgba(11,31,61,.07)}
.cerchio{width:74px;height:74px;border-radius:50%;
display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px}
h1{font-size:26px;font-weight:800;letter-spacing:-.7px;margin-bottom:12px;color:var(--notte)}
p{color:var(--grigio);font-size:15.5px;margin-bottom:10px}
.btn{display:inline-block;margin-top:20px;background:var(--corallo);color:#fff;
padding:16px 30px;border-radius:13px;font-weight:800;text-decoration:none;font-size:15.5px}
.marchio{margin-top:28px;display:inline-block;background:var(--notte);border-radius:12px;padding:10px 16px}
.attesa{color:var(--grigio)}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="attesa">Verifico il pagamento…</div>
</div>

<script>
const STRIPE_PUBLIC_KEY = 'pk_live_51HUprcHeIz0GVO4KOlGb3ZdLrn4OfWrqgr7tjmMkFYiPK0RiaeM11B11CTFK67MptXSM47rhaZTfjq2F3e9W4xMO00HXznXO8v';

const stripe = Stripe(STRIPE_PUBLIC_KEY);
const clientSecret = new URLSearchParams(location.search).get('payment_intent_client_secret');
const box = document.getElementById('box');

function mostra(icona, titolo, testo, colore){
  box.innerHTML =
    '<div class="cerchio" style="background:' + colore + '">' + icona + '</div>' +
    '<h1>' + titolo + '</h1>' +
    '<p>' + testo + '</p>' +
    '<a class="btn" href="index.html">Torna al negozio</a>' +
    '<div><span class="marchio"><img src="img/logo.png" alt="PijamaMania" style="height:30px;width:auto;display:block"></span></div>';
}

if(!clientSecret){
  mostra('🦈', 'Nessun ordine da mostrare', 'Sembra che tu sia arrivato qui per sbaglio.', '#e7f2fc');
} else {
  stripe.retrievePaymentIntent(clientSecret).then(({ paymentIntent }) => {
    switch(paymentIntent && paymentIntent.status){
      case 'succeeded':
        mostra('✓', 'Ordine confermato!',
          'Grazie, abbiamo ricevuto il pagamento. Ti arriva subito una email di conferma e, appena il pacco parte, il codice di tracciamento.',
          '#e6f6ee');
        // manda la mail di conferma (il server controlla con Stripe che il pagamento sia vero)
        fetch('/api/conferma-ordine', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id: paymentIntent.id })
        }).catch(() => {});
        break;
      case 'processing':
        mostra('⏳', 'Pagamento in elaborazione',
          'La banca sta confermando la transazione. Ti avvisiamo via email appena è tutto a posto.',
          '#fff6dc');
        break;
      default:
        mostra('✕', 'Pagamento non riuscito',
          'Non siamo riusciti ad addebitare la carta. Nessun importo è stato prelevato: puoi riprovare quando vuoi.',
          '#fff0f0');
    }
  });
}
</script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
